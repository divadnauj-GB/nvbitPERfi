number_injections: 4096

hw_targets:
  smid: 0
  schid: 0

config_fm:  
  IRA:
    mode: None
  ICOC:
    mode: None
  IIO:
    mode: None
  IAT:
    mode: None
  IAW: 
    mode: None
  IAC: 
    mode: None
  WV:
    mode: None
  IMS: 
    mode: None
  IMD: 
    mode: None
  IAL:
    mode: None
  REGs:
    # mode: "st", "rnd", "stat"
    mode: "st"
    # thread identifier if mode st: if -1 any thread
    thrid: [0]
    kname: "gemm"
  PR:
    # mode: "st", "rnd", "stat", "randthr"
    mode: "st"
    # thread identifier if mode st: if -1 any thread
    thrid: [0,7]
    kname: "gemm"
  FUs:
    # mode: "int32", "fp32", "sfu", "tensor"
    igrp: "FP32_INSTR"
    instrid: [-1]  # if [-1] all intructions in the group ["FFMA", "FMUL"]
    laneid: 0 # line ID (0,16) if -1 random cores, -2 exaustive
    portid: -2 # if -1 indicate random port, 0 indicate output, 1,2,3 input ports, -2 exaustive    
    maskid: -2 # -1 random stuck-at, -2 exhaustive stuck-at, 0 - xxx other extenstions,     
  INT:
    # mode: "int32", "fp32", "sfu", "tensor"
    igrp: "INT_INSTR"
    instrid: [-1]  # if [-1] all intructions in the group ["FFMA", "FMUL"]
    laneid: 0 # line ID (0,16) if -1 random cores, -2 exaustive
    portid: -2 # if -1 indicate random port, 0 indicate output, 1,2,3 input ports, -2 exaustive    
    maskid: -2 # -1 random stuck-at, -2 exhaustive stuck-at, 0 - xxx other extenstions,   
  FP:
    # mode: "int32", "fp32", "sfu", "tensor"
    igrp: "FP32_INSTR"
    instrid: [-1]  # if [-1] all intructions in the group ["FFMA", "FMUL"]
    laneid: 0 # line ID (0,16) if -1 random cores, -2 exaustive
    portid: -2 # if -1 indicate random port, 0 indicate output, 1,2,3 input ports, -2 exaustive    
    maskid: -2 # -1 random stuck-at, -2 exhaustive stuck-at, 0 - xxx other extenstions,  
  SFU:
    # mode: "int32", "fp32", "sfu", "tensor"
    igrp: "SFU_INSTR"
    instrid: [-1]  # if [-1] all intructions in the group ["FFMA", "FMUL"]
    laneid: -2 # line ID (0,16) if -1 random cores, -2 exaustive
    portid: 0 # if -1 indicate random port, 0 indicate output, 1,2,3 input ports, -2 exaustive    
    maskid: -2 # -1 random stuck-at, -2 exhaustive stuck-at, 0 - xxx other extenstions,
  TCU:
    # mode: "int32", "fp32", "sfu", "tensor"
    igrp: "MMA_INSTR"
    instrid: ["HMMA"]  # if [-1] all intructions in the group ["FFMA", "FMUL"]
    laneid: -2 # line ID (0,16) if -1 random cores, -2 exaustive
    portid: 0 # if -1 indicate random port, 0 indicate output, 1,2,3 input ports, -2 exaustive    
    maskid: -2 # -1 random stuck-at, -2 exhaustive stuck-at, 0 - xxx other extenstions, 





    
      